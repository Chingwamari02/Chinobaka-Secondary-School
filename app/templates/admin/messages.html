{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>Contact messages</h1></div><section class="panel">{%for m in items%}<div class="msg {%if not m.is_read%}unread{%endif%}"><h3>{{m.subject or 'No subject'}}</h3><small>{{m.name}} · {{m.email}} · {{m.created_at.strftime('%d %b %Y %H:%M')}}</small><p>{{m.message}}</p><div>{%if not m.is_read%}<form class="inline" method="post" action="{{url_for('admin.message_read',item_id=m.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn light">Mark read</button></form>{%endif%}<form class="inline" method="post" action="{{url_for('admin.message_delete',item_id=m.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">Delete</button></form></div></div>{%else%}<p>No messages received.</p>{%endfor%}</section>{%endblock%}
