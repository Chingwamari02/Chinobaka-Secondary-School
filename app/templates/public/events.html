{%extends 'base.html'%}{%block content%}<section class="pagehero"><div class="container"><span class="eyebrow">EVENTS</span><h1>School calendar.</h1></div></section><section class="section"><div class="container events">{%for e in items%}<div class="event"><time>{{e.event_date.strftime('%d')}}<small>{{e.event_date.strftime('%b')}}</small></time><div><h3>{{e.title}}</h3><p>{{e.description}}</p><small>{{e.location or 'Location to be confirmed'}}</small></div></div>{%else%}<div class="empty">No events published.</div>{%endfor%}</div></section>{%endblock%}
