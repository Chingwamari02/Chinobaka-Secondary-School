{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>Boarding facilities</h1><a class="btn primary" href="{{url_for('admin.boarding_list_form_new')}}">Add facility</a></div><section class="panel table"><table><tr><th>Title</th><th>Description</th><th>Order</th><th>Actions</th></tr>{%for item in items%}<tr><td>{{item.title}}</td><td>{{item.description[:100]}}</td><td>{{item.sort_order}}</td><td><a class="link" href="{{url_for('admin.boarding_list_form_edit',item_id=item.id)}}">Edit</a> <form class="inline" method="post" action="{{url_for('admin.boarding_list_delete',item_id=item.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">Delete</button></form></td></tr>{%else%}<tr><td colspan="4">No boarding facilities yet.</td></tr>{%endfor%}</table></section>{%endblock%}
