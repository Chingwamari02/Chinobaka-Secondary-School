{% extends "base.html" %}{% block content %}<section class="admin-wrap"><div class="container"><div class="admin-top"><h1>News</h1><a class="btn btn-primary" href="{{ url_for('admin.new_news') }}">+ New News</a></div><div class="card"><table><tr><th>Title</th><th>Status</th><th>Created</th></tr>{% for item in items %}<tr><td>{{ item.title }}</td><td>{{ item.status }}</td><td>{{ item.created_at.strftime('%Y-%m-%d') }}</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
