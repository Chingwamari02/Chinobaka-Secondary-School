{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>Events</h1><a class="btn primary" href="{{url_for('admin.events_form')}}">+ Add new</a></div><section class="panel table"><table><thead><tr><th>Event</th><th>Details</th><th>Actions</th></tr></thead><tbody>{%for item in items%}<tr><td><b>{{item.title}}</b></td><td>{{item.location or "To be confirmed"}}</td><td><a href="{{url_for('admin.events_form',item_id=item.id)}}">Edit</a> <form class="inline" method="post" action="{{url_for('admin.events_delete',item_id=item.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">Delete</button></form></td></tr>{%else%}<tr><td colspan="3">No records yet.</td></tr>{%endfor%}</tbody></table></section>{%endblock%}
