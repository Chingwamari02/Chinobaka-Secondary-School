{%extends 'base.html'%}{%block content%}<section class="pagehero"><div class="container"><span class="eyebrow">LEADERSHIP & STAFF</span><h1>Meet our team.</h1></div></section><section class="section"><div class="container cards">{%for x in items%}<article class="info">{%if x.image_filename%}<img class="staffimg" src="{{url_for('public.image',filename=x.image_filename)}}" alt="{{x.name}}">{%endif%}<h3>{{x.name}}</h3><b>{{x.position}}</b><p>{{x.bio or 'Profile information to be confirmed.'}}</p></article>{%else%}<div class="empty">Staff profiles have not yet been published.</div>{%endfor%}</div></section>{%endblock%}
