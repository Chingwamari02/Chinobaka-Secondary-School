{% extends "base.html" %}{% block content %}<section class="admin-wrap"><div class="container"><h1>Events</h1><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required></label><label>Description<textarea name="description"></textarea></label><label>Date<input type="date" name="event_date" required></label><label>Location<input name="location"></label><button class="btn btn-primary">Add event</button></form><div class="cards">{% for item in items %}<article class="card"><h3>{{ item.title }}</h3><p>{{ item.event_date }} · {{ item.location }}</p></article>{% endfor %}</div></div></section>{% endblock %}
