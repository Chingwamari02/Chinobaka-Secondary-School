{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>{{'Edit' if item else 'New'}} Event</h1></div><form class="panel formgrid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" value="{{item.title if item else ""}}" required></label><label>Description<textarea name="description" rows="7">{{item.description if item else ""}}</textarea></label><label>Location<input name="location" value="{{item.location if item else ""}}"></label><label>Event Date<input type="datetime-local" name="event_date" value="{{item.event_date if item else ""}}" required></label><label>Image<input type="file" name="image" accept="image/*"></label><div class="actions"><button class="btn primary">Save</button></div></form>{%endblock%}
