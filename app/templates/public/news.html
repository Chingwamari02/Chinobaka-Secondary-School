{%extends 'base.html'%}{%block content%}<section class="pagehero"><div class="container"><span class="eyebrow">NEWS</span><h1>What's happening at school.</h1></div></section><section class="section"><div class="container cards">{%for n in items%}<article class="card">{%if n.image_filename%}<img src="{{url_for('public.image',filename=n.image_filename)}}" alt="{{n.title}}">{%endif%}<div><small>{{n.published_at.strftime('%d %b %Y')}}</small><h3>{{n.title}}</h3><p>{{n.excerpt or n.body[:180]}}</p><a class="link" href="{{url_for('public.news_detail',slug=n.slug)}}">Read article →</a></div></article>{%else%}<div class="empty">No published news yet.</div>{%endfor%}</div></section>{%endblock%}
