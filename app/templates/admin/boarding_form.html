{%extends 'admin/base.html'%}{%block content%}<h1>{{'Edit' if item else 'Add'}} boarding facility</h1><form class='panel formgrid' method='post' enctype='multipart/form-data'><input type='hidden' name='csrf_token' value='{{csrf_token()}}'><label>Title<input name='title' value='{{item.title if item else ''}}' required></label><label>Display order<input type='number' name='sort_order' value='{{item.sort_order if item else 0}}'></label><label class='wide'>Description<textarea name='description' rows='6' required>{{item.description if item else ''}}</textarea></label><label class='wide'>Image<input type='file' name='image' accept='image/*'></label><div class='actions'><button class='btn primary'>Save</button></div></form>{%endblock%}
