{%extends 'base.html'%}{%block content%}<section class="pagehero"><div class="container"><span class="eyebrow">CONTACT</span><h1>We'd be glad to hear from you.</h1></div></section><section class="section"><div class="container split"><div><h2>School contact</h2><p>{{settings.address}}</p><p>{{settings.phone}}</p><p>{{settings.email}}</p></div><form class="form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label><label>Subject<input name="subject"></label><label>Message<textarea name="message" rows="7" required></textarea></label><button class="btn primary">Send message</button></form></div></section>{%endblock%}
