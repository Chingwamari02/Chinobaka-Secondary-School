{%extends 'admin/base.html'%}{%block content%}<h1>{{'Edit' if item else 'Add'}} student leader</h1><form class='panel formgrid' method='post' enctype='multipart/form-data'><input type='hidden' name='csrf_token' value='{{csrf_token()}}'><label>Name<input name='name' value='{{item.name if item else ''}}' required></label><label>Position<input name='position' value='{{item.position if item else ''}}' required></label><label>Level<input name='level' value='{{item.level if item else 'Student Leadership'}}'></label><label>Display order<input type='number' name='sort_order' value='{{item.sort_order if item else 0}}'></label><label class='wide'>Description<textarea name='description' rows='5'>{{item.description if item else ''}}</textarea></label><label class='wide'>Photo<input type='file' name='image' accept='image/*'></label><div class='actions'><button class='btn primary'>Save</button></div></form>{%endblock%}
