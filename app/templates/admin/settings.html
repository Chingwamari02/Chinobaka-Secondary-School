{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><div><span class="eyebrow blue">BRANDING</span><h1>School settings</h1><p>Use only verified school information.</p></div></div><form class="panel formgrid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{%for f in ['school_name','motto','phone','email','address','hero_title']%}<label>{{f.replace('_',' ').title()}}<input name="{{f}}" value="{{item|attr(f)}}"></label>{%endfor%}<label class="wide">About text<textarea name="about_text" rows="6">{{item.about_text}}</textarea></label><label class="wide">Hero text<textarea name="hero_text" rows="4">{{item.hero_text}}</textarea></label><label>School logo<input type="file" name="logo" accept="image/*"></label><label>Hero image<input type="file" name="hero_image" accept="image/*"></label><div class="actions"><button class="btn primary">Save settings</button></div></form>{%endblock%}
