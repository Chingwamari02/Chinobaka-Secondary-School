{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>{{'Edit' if item else 'New'}} Staff profile</h1></div><form class="panel formgrid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" value="{{item.name if item else ""}}" required></label><label>Position<input name="position" value="{{item.position if item else ""}}" required></label><label>Bio<textarea name="bio" rows="7">{{item.bio if item else ""}}</textarea></label><label>Sort Order<input name="sort_order" value="{{item.sort_order if item else ""}}"></label><label>Image<input type="file" name="image" accept="image/*"></label><div class="actions"><button class="btn primary">Save</button></div></form>{%endblock%}
