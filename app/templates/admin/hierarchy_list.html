{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>Student leadership</h1><a class="btn primary" href="{{url_for('admin.hierarchy_list_form_new')}}">Add leader</a></div><section class="panel table"><table><tr><th>Name</th><th>Position</th><th>Level</th><th>Order</th><th>Actions</th></tr>{%for item in items%}<tr><td>{{item.name}}</td><td>{{item.position}}</td><td>{{item.level}}</td><td>{{item.sort_order}}</td><td><a class="link" href="{{url_for('admin.hierarchy_list_form_edit',item_id=item.id)}}">Edit</a> <form class="inline" method="post" action="{{url_for('admin.hierarchy_list_delete',item_id=item.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">Delete</button></form></td></tr>{%else%}<tr><td colspan="5">No student leaders yet.</td></tr>{%endfor%}</table></section>{%endblock%}
