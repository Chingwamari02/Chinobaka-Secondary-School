{%extends 'admin/base.html'%}{%block content%}<h1>{{'Edit' if item else 'Add'}} achievement</h1><form class='panel formgrid' method='post' enctype='multipart/form-data'><input type='hidden' name='csrf_token' value='{{csrf_token()}}'><label>Title<input name='title' value='{{item.title if item else ''}}' required></label><label>Category<input name='category' value='{{item.category if item else 'General'}}'></label><label class='wide'>Description<textarea name='description' rows='6' required>{{item.description if item else ''}}</textarea></label><label class='wide'>Image<input type='file' name='image' accept='image/*'></label><div class='actions'><button class='btn primary'>Save</button></div></form>{%endblock%}
