{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>{{'Edit' if item else 'New'}} Gallery item</h1></div><form class="panel formgrid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" value="{{item.title if item else ""}}" required></label><label>Caption<textarea name="caption" rows="7">{{item.caption if item else ""}}</textarea></label><label>Category<input name="category" value="{{item.category if item else ""}}"></label><label>Image<input type="file" name="image" accept="image/*"></label><div class="actions"><button class="btn primary">Save</button></div></form>{%endblock%}
