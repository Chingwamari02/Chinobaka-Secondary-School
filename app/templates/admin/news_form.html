{%extends 'admin/base.html'%}{%block content%}<div class="adminhead"><h1>{{'Edit' if item else 'New'}} News article</h1></div><form class="panel formgrid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" value="{{item.title if item else ""}}" required></label><label>Excerpt<textarea name="excerpt" rows="7">{{item.excerpt if item else ""}}</textarea></label><label>Body<textarea name="body" rows="7">{{item.body if item else ""}}</textarea></label><label>Image<input type="file" name="image" accept="image/*"></label><div class="actions"><button class="btn primary">Save</button></div></form>{%endblock%}
